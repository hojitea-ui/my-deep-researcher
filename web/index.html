<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Factory</title>
<link rel="preload" href="/web/vendor/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/web/vendor/fonts/IBMPlexMono-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="data:,">
<style>
  /* ── 글꼴: 프로젝트에 포함한 파일을 먼저 쓰고(설치돼 있으면 로컬 글꼴), 실패하면 아래 대체 글꼴로 ──
     Pretendard (SIL OFL 1.1) · IBM Plex Mono (SIL OFL 1.1) — 라이선스는 web/vendor/fonts/ 에 있다 */
  @font-face { font-family: "Pretendard Variable"; font-style: normal; font-weight: 45 920; font-display: swap;
    src: local("Pretendard Variable"), url("/web/vendor/fonts/PretendardVariable.woff2") format("woff2-variations"), url("/web/vendor/fonts/PretendardVariable.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 400; font-display: swap; src: local("IBM Plex Mono"), local("IBMPlexMono"), url("/web/vendor/fonts/IBMPlexMono-400.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 500; font-display: swap; src: local("IBM Plex Mono Medium"), local("IBMPlexMono-Medium"), url("/web/vendor/fonts/IBMPlexMono-500.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 600; font-display: swap; src: local("IBM Plex Mono SemiBold"), local("IBMPlexMono-SemiBold"), url("/web/vendor/fonts/IBMPlexMono-600.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 700; font-display: swap; src: local("IBM Plex Mono Bold"), local("IBMPlexMono-Bold"), url("/web/vendor/fonts/IBMPlexMono-700.woff2") format("woff2"); }

  /* ── Chromatic Industrial ─────────────────────────────────────────────────────
     Titanium White #E7E9E7 · Aluminium #BBC3C5 · Graphite #30383D
     Signal Blue #287CC2 = 상태·제어 · Process Cyan #008F91 = 데이터 흐름 · Industrial Orange #C16C45 = 예외·주의
     CMYK(#00BCEB #E83E91 #F2D600 #343434)는 스트립·구분선 일부·작은 식별 마커에만 쓴다 */
  :root {
    --ti: #e7e9e7; --ti-2: #f3f4f3; --al: #bbc3c5; --al-2: #d4d9da; --al-3: #c8cfd1;
    --gr: #30383d; --gr-2: #3b454b; --gr-3: #262c30;
    --ink: #30383d; --ink-2: rgba(48, 56, 61, 0.74); --ink-3: rgba(48, 56, 61, 0.54);
    --on-dark: #e7e9e7; --on-dark-2: rgba(231, 233, 231, 0.72); --on-dark-3: rgba(231, 233, 231, 0.5);
    --blue: #287cc2; --blue-soft: rgba(40, 124, 194, 0.12); --blue-lite: #78aee0;
    --cyan: #008f91; --cyan-soft: rgba(0, 143, 145, 0.12);
    --orange: #c16c45; --orange-soft: rgba(193, 108, 69, 0.14);
    --k-c: #00bceb; --k-m: #e83e91; --k-y: #f2d600; --k-k: #343434;
    --line: rgba(48, 56, 61, 0.16); --line-2: rgba(48, 56, 61, 0.3);
    --dline: rgba(231, 233, 231, 0.14); --dline-2: rgba(231, 233, 231, 0.26);
    --cmy: linear-gradient(90deg, var(--k-c) 0 33.3%, var(--k-m) 33.3% 66.6%, var(--k-y) 66.6% 100%);
    --cmyk-strip: linear-gradient(90deg, var(--k-c) 0 22%, transparent 22% 26%, var(--k-m) 26% 48%, transparent 48% 52%, var(--k-y) 52% 74%, transparent 74% 78%, var(--k-k) 78% 100%);
    --hatch-dark: repeating-linear-gradient(135deg, rgba(231, 233, 231, 0.10) 0 1.5px, transparent 1.5px 7px);
    --hatch-light: repeating-linear-gradient(135deg, rgba(48, 56, 61, 0.12) 0 1.5px, transparent 1.5px 7px);
    --hatch-orange: repeating-linear-gradient(135deg, rgba(193, 108, 69, 0.7) 0 3px, transparent 3px 7px);
    --mono: "IBM Plex Mono", "Cascadia Mono", "SFMono-Regular", Consolas, "Liberation Mono", "Pretendard Variable", Pretendard, "Malgun Gothic", monospace;
    --sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    --r: 3px; --pad: 14px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--gr); color: var(--ink); font: 13px/1.55 var(--sans); letter-spacing: -0.005em; overflow: hidden; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; word-break: keep-all; overflow-wrap: break-word; } /* 한국어는 낱말 사이에서만 줄바꿈, 넘칠 만큼 긴 낱말만 쪼갠다 */
  button, select, input { font: inherit; color: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: rgba(48,56,61,.22); } ::-webkit-scrollbar-track { background: transparent; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }

  /* 공통: 라벨 · 섹션 머리 · 상태 표시등 */
  .lbl { font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .id { font: 600 11px/1 var(--mono); letter-spacing: .04em; color: var(--ink-2); }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; font-style: normal; }
  .mono { font-family: var(--mono); }
  /* 제목 · 가는 선 · 보조 설명. 설명이 한 줄에 다 안 들어가면 말줄임 대신 다음 줄 오른쪽으로 내려간다 */
  .sec { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 20px 0 10px; font: 600 11px/1 var(--mono); white-space: nowrap; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
  .sec:first-child { margin-top: 2px; }
  .sec b { background: var(--gr); color: var(--on-dark); padding: 4px 6px 3px; font-weight: 600; letter-spacing: .06em; }
  .sec::after { content: ""; flex: 1 1 16px; height: 1px; background: var(--line-2); order: 2; }
  .sec .meta { order: 3; margin-left: auto; color: var(--ink-3); font-weight: 500; letter-spacing: .06em; line-height: 1.4; white-space: normal; text-align: right; }
  .led { display: inline-flex; align-items: center; gap: 6px; font: 700 10.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
  .led::before { content: ""; width: 7px; height: 7px; background: var(--al); }
  .led.active, .led.online { color: var(--blue); } .led.active::before, .led.online::before { background: var(--blue); box-shadow: 0 0 0 2px var(--blue-soft); }
  .led.done { color: var(--ink-2); } .led.done::before { background: var(--gr); }
  .led.warn { color: var(--orange); } .led.warn::before { background: var(--orange); }
  .led.live::before { animation: blink 1.1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .ico { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ── 상단: Graphite 시스템 바 + 밝은 질의 바 ── */
  header { position: fixed; top: 10px; left: 12px; right: 12px; z-index: 6; display: grid; gap: 6px; }
  .sysbar, .querybar { display: flex; align-items: center; gap: 14px; border-radius: var(--r); }
  .sysbar { position: relative; height: 46px; padding: 0 14px; background: var(--gr); color: var(--on-dark); border: 1px solid var(--gr-3); box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  .sysbar::after { content: ""; position: absolute; left: 14px; bottom: -1px; width: 72px; height: 3px; background: var(--cmy); }
  .mark { width: 28px; height: 28px; border: 1.5px solid var(--on-dark); display: grid; place-items: center; position: relative; flex: none; }
  .mark::before { content: ""; width: 10px; height: 10px; background: var(--blue); transform: rotate(45deg); }
  .brand b { display: block; font: 700 14px/1 var(--mono); letter-spacing: .1em; white-space: nowrap; color: #fff; }
  .brand b i { font-style: normal; color: var(--blue-lite); }
  .brand span { display: block; margin-top: 4px; font: 500 9.5px/1 var(--mono); letter-spacing: .2em; color: var(--on-dark-3); white-space: nowrap; }
  .sysbar .hatch { flex: 1; align-self: stretch; margin: 9px 0; background: var(--hatch-dark); }
  .sysbar .lbl { color: var(--on-dark-3); }
  .stat { display: flex; align-items: center; gap: 8px; padding-left: 14px; border-left: 1px solid var(--dline); white-space: nowrap; }
  .stat .v { font: 600 11px/1 var(--mono); letter-spacing: .06em; color: var(--on-dark); }
  #modeBox .v { font-family: var(--sans); letter-spacing: 0; font-size: 12px; }
  #modeBox.live .v { color: var(--blue-lite); }
  .sysbar .led { color: var(--on-dark-2); } .sysbar .led.online, .sysbar .led.active { color: var(--blue-lite); } .sysbar .led.done { color: var(--on-dark); } .sysbar .led.done::before { background: var(--al); }
  .tog { display: flex; gap: 4px; padding-left: 14px; border-left: 1px solid var(--dline); }
  .tog button { width: 30px; height: 26px; background: var(--gr-2); border: 1px solid var(--dline-2); border-radius: 2px; cursor: pointer; font: 600 10px var(--mono); color: var(--on-dark-2); }
  .tog button:hover { border-color: var(--blue-lite); color: #fff; }
  .tog button.wide { width: auto; padding: 0 8px; letter-spacing: .08em; }
  .querybar { height: 50px; padding: 0 6px 0 14px; background: var(--ti); border: 1px solid var(--line-2); box-shadow: 0 6px 18px rgba(0,0,0,.18); }
  .querybar .lbl { white-space: nowrap; color: var(--ink-2); }
  .querybar input { flex: 1; min-width: 0; height: 36px; background: #fff; border: 1px solid var(--al); border-radius: 2px; padding: 0 12px; font-size: 15px; font-weight: 500; color: var(--ink); }
  .querybar input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue-soft); }
  .btn { height: 36px; padding: 0 16px; background: var(--al-2); border: 1px solid var(--al); border-radius: 2px; cursor: pointer; white-space: nowrap; font-weight: 600; color: var(--ink); }
  .btn:hover:not(:disabled) { border-color: var(--blue); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 700; }
  .btn.primary:hover:not(:disabled) { background: #2f8ad5; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.sm { height: 28px; padding: 0 12px; font: 600 11px/1 var(--mono); letter-spacing: .06em; }
  .dl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 2px 0 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line-2); }
  .dl .small { flex: 1 0 100%; min-width: 0; line-height: 1.5; }
  .dl .small > span { display: block; } /* 파일 이름 줄 / 보고서 정보 줄: 뜻 단위로 나눈다 */
  .dl .small .fn { overflow-wrap: anywhere; }
  .querybar select { height: 36px; max-width: 220px; background: #fff; border: 1px solid var(--al); border-radius: 2px; padding: 0 8px; color: var(--ink); }
  .vsep { width: 1px; align-self: stretch; margin: 8px 0; background: var(--line-2); }
  .notice { display: none; align-items: center; gap: 8px; height: 36px; padding: 0 10px 0 0; max-width: 230px; flex: none; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 11.5px; background: var(--orange-soft); border: 1px solid var(--orange); border-radius: 2px; color: var(--ink); }
  .notice::before { content: ""; align-self: stretch; width: 10px; background: var(--hatch-orange); }
  .notice .lbl { color: var(--orange); }

  /* ── 패널 공통: Titanium White 정보 영역 + Graphite 제목 바 ── */
  .panel { position: fixed; z-index: 4; background: rgba(231, 233, 231, 0.95); border: 1px solid rgba(48,56,61,.35); border-radius: var(--r); box-shadow: 0 10px 28px rgba(0,0,0,.28); }
  .ptitle { position: relative; display: flex; align-items: stretch; background: var(--gr); border-radius: var(--r) var(--r) 0 0; }
  .ptitle::after { content: ""; position: absolute; left: var(--pad); bottom: -2px; width: 66px; height: 3px; background: var(--cmy); }
  .ptitle h2 { margin: 0; padding: 13px var(--pad) 11px; font: 700 18px/1 var(--mono); letter-spacing: .06em; white-space: nowrap; color: #fff; }
  .ptitle h2 small { display: block; margin-top: 6px; font: 600 11px/1 var(--sans); letter-spacing: .02em; color: var(--on-dark-3); }
  .ptitle .fill { flex: 1; background: var(--hatch-dark); border-left: 1px solid var(--dline); }
  #left { top: 118px; left: 12px; bottom: 124px; width: 290px; display: flex; flex-direction: column; }
  #right { top: 118px; right: 12px; bottom: 124px; width: 350px; display: flex; flex-direction: column; }
  body.hide-left #left, body.hide-right #right { display: none; }
  .pbody { flex: 1; min-height: 0; overflow-y: auto; padding: 14px var(--pad) var(--pad); }

  /* 좌측: 운영 현황 */
  .hero { margin: 2px 0 12px; font: 700 17px/1.45 var(--sans); letter-spacing: -0.015em; color: var(--ink); }
  .kv { display: grid; grid-template-columns: 64px 1fr; gap: 6px 10px; font-size: 12.5px; margin: 0; }
  .kv dt { font: 500 10px/1.9 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  .kv dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .flow { position: relative; display: grid; gap: 2px; }
  .step { position: relative; display: grid; grid-template-columns: 20px 22px minmax(0, 1fr) auto; align-items: center; gap: 6px; padding: 5px 0; color: var(--ink-3); }
  .step .dot { width: 11px; height: 11px; border: 1.5px solid var(--al); border-radius: 50%; justify-self: center; background: var(--ti); z-index: 1; }
  .step:not(:last-child)::after { content: ""; position: absolute; left: 9.5px; top: 19px; bottom: -9px; width: 1px; background: var(--line-2); }
  .step .no { font: 600 10.5px var(--mono); color: var(--ink-3); }
  .step .nm { display: flex; align-items: center; gap: 7px; min-width: 0; color: var(--ink); font-size: 13px; white-space: nowrap; overflow: hidden; }
  .step .nm span { overflow: hidden; text-overflow: ellipsis; margin-left: 6px; font: 500 9.5px var(--mono); letter-spacing: .1em; color: var(--ink-3); }
  .step.active { color: var(--blue); } .step.active .dot { border-color: var(--blue); background: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
  .step.active .nm { font-weight: 700; }
  .step.done { color: var(--ink-2); } .step.done .dot { border-color: var(--gr); background: var(--gr); }
  .meter { position: relative; height: 10px; background: var(--al-2); border: 1px solid var(--line); margin: 6px 0 4px; overflow: hidden; }
  .meter b { position: absolute; top: 0; bottom: 0; left: 0; background: var(--cyan); }
  .meter b.ice { background: var(--cyan); }
  .meter b.over { left: auto; right: 0; background: var(--hatch-light); }
  .meter .edge { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--gr); }
  .small { font-size: 12px; line-height: 1.55; color: var(--ink-2); }
  .iso { display: grid; gap: 6px; }
  .iso .row { display: grid; grid-template-columns: 50px 1fr 76px; align-items: center; gap: 8px; font-size: 11.5px; }
  .iso .row .meter { margin: 0; height: 8px; }
  .iso .row:first-child .meter b { background: var(--gr); }
  .iso .row .v { text-align: right; font: 500 11px var(--mono); color: var(--ink-2); }
  .fac { color: var(--ink); }
  .bay { border: 1px solid var(--line); border-left: 3px solid var(--al); background: var(--ti-2); padding: 9px 10px; margin-bottom: 8px; border-radius: 2px; }
  .bay.active { border-left-color: var(--blue); background: #f0f5fa; }
  .bay.short { border-left-color: var(--orange); background: #faf2ee; }
  .bay .hd { display: flex; align-items: center; gap: 8px; }
  .bay .tag { font: 700 12px/1 var(--mono); padding: 5px 6px; letter-spacing: .04em; background: var(--gr); color: var(--on-dark); }
  .bay.active .tag { background: var(--blue); color: #fff; }
  .bay .role { font-size: 11.5px; color: var(--ink-2); }
  .bay .hd .led { margin-left: auto; }
  .bay .ttl { margin: 8px 0 4px; font-weight: 800; font-size: 14px; color: var(--ink); }
  .bay .now { display: flex; align-items: center; flex-wrap: wrap; gap: 0; font-size: 12px; color: var(--ink-2); min-height: 20px; }
  .bay .now.warn { color: var(--orange); }
  .stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin: 7px 0 6px; background: var(--line); border: 1px solid var(--line); }
  .stats3 div { background: #fff; padding: 5px 7px; }
  .stats3 .lbl { font-size: 9.5px; } .stats3 b { display: block; margin-top: 5px; font: 700 15px var(--mono); color: var(--ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font-size: 11px; padding: 2px 6px; border: 1px solid var(--line-2); color: var(--ink); border-radius: 2px; cursor: pointer; background: #fff; }
  .chip:hover { border-color: var(--blue); color: var(--blue); }
  .chip.dup { border-color: var(--orange); color: var(--orange); }
  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .metric { border: 1px solid var(--line); background: #fff; padding: 8px; border-radius: 2px; }
  .metric .lbl { font-size: 9.5px; } .metric b { display: block; margin: 7px 0 4px; font: 700 21px/1 var(--mono); color: var(--ink); }
  .metric span { font-size: 11px; color: var(--ink-3); }
  .metric.alarm { border-color: var(--orange); background: #faf2ee; } .metric.alarm b { color: var(--orange); }
  .metric.wide { grid-column: span 2; }

  /* 우측: 탭 · 이벤트 · 문서 · 보고서 */
  .tabs { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--gr); border-radius: var(--r) var(--r) 0 0; }
  .tabs::after { content: ""; position: absolute; left: var(--pad); bottom: -2px; width: 66px; height: 3px; background: var(--cmy); z-index: 1; }
  .tabs button { background: none; border: 0; border-right: 1px solid var(--dline); padding: 10px 8px 9px; cursor: pointer; text-align: left; color: var(--on-dark-3); }
  .tabs button:last-child { border-right: 0; }
  .tabs button b { display: block; font: 600 9.5px/1 var(--mono); letter-spacing: .1em; white-space: nowrap; }
  .tabs button span { display: block; margin-top: 5px; font-size: 12.5px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tabs button.on { color: #fff; background: var(--gr-2); box-shadow: inset 0 -3px 0 var(--blue); }
  .tabs button.on b { color: var(--blue-lite); }
  .view { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .view.on { display: flex; }
  .list { flex: 1 1 46%; min-height: 0; overflow-y: auto; border-bottom: 1px solid var(--line-2); background: var(--ti-2); }
  .detail { flex: 1 1 54%; min-height: 0; overflow-y: auto; padding: 12px var(--pad) var(--pad); }
  .ev { position: relative; display: grid; grid-template-columns: 54px 38px 40px 1fr; gap: 6px; align-items: center; padding: 6px var(--pad) 6px 12px; cursor: pointer; border-left: 3px solid transparent; border-bottom: 1px solid rgba(48,56,61,.06); font-size: 12.5px; color: var(--ink); }
  .ev::before { content: ""; position: absolute; left: 4px; top: 7px; bottom: 7px; width: 3px; background: transparent; }
  .ev[data-g="data"]::before { background: var(--cyan); } .ev[data-g="state"]::before { background: var(--blue); } .ev[data-g="warn"]::before { background: var(--orange); }
  .ev:hover { background: rgba(48,56,61,.05); }
  .ev.cur { background: var(--blue-soft); border-left-color: var(--blue); }
  .ev.future { opacity: .38; }
  .ev .i, .ev .t { font: 500 11px var(--mono); color: var(--ink-3); }
  .ev .who { font: 600 10.5px var(--mono); color: var(--ink); }
  .ev .who.ct { color: var(--ink-2); }
  .ev .d { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev.k-node .d { color: var(--ink-2); }
  .ev.k-draft .d { font-weight: 600; }
  .ev.k-warn .d { color: var(--orange); font-weight: 600; }
  .spec { width: 100%; border-collapse: collapse; margin: 4px 0 10px; font-size: 12px; }
  .spec th { width: 92px; text-align: left; font: 500 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); padding: 5px 8px 5px 0; vertical-align: top; border-bottom: 1px solid var(--line); }
  .spec td { padding: 5px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  pre.code { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--gr); color: var(--on-dark); border: 0; border-left: 3px solid var(--al); padding: 9px 11px; margin: 0 0 12px; font: 11.5px/1.55 var(--mono); max-height: 300px; overflow-y: auto; border-radius: 2px; }
  pre.code.reply { border-left-color: var(--cyan); }
  .doc { display: grid; grid-template-columns: 62px 1fr auto; gap: 8px; align-items: center; padding: 7px var(--pad) 7px 11px; border-bottom: 1px solid rgba(48,56,61,.06); cursor: pointer; border-left: 3px solid transparent; font-size: 12px; }
  .doc:hover { background: rgba(48,56,61,.05); }
  .doc.sel { background: var(--blue-soft); border-left-color: var(--blue); }
  .doc .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc .nm small { display: block; height: 3px; margin-top: 4px; background: var(--cyan); opacity: .7; }
  .doc .rd { display: flex; gap: 3px; }
  .doc .rd i { font: 600 9.5px/1 var(--mono); font-style: normal; padding: 3px 4px; background: var(--gr); color: var(--on-dark); }
  .doc .rd i.unread { background: transparent; border: 1px solid var(--line-2); color: var(--ink-3); }
  .doc.unread-row .nm { color: var(--ink-2); }
  .filters { display: flex; gap: 4px; padding: 8px var(--pad); border-bottom: 1px solid var(--line-2); background: var(--ti); }
  .filters button { background: #fff; border: 1px solid var(--line-2); padding: 4px 8px; font: 600 10px var(--mono); letter-spacing: .08em; cursor: pointer; color: var(--ink-3); border-radius: 2px; }
  .filters button.on { color: #fff; background: var(--blue); border-color: var(--blue); }
  .report { flex: 1; overflow-y: auto; padding: 12px var(--pad) var(--pad); }
  .rsec { border: 1px solid var(--line-2); border-radius: 2px; margin-bottom: 10px; background: var(--ti-2); }
  .rsec .hd { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--al-2); }
  .rsec .bd { padding: 8px 10px; }
  .h1 { font: 700 16px/1.4 var(--sans); letter-spacing: -0.01em; margin: 4px 0 10px; color: var(--ink); }

  /* ── 하단: Graphite 재생 제어부 + CMYK 스트립 ── */
  #timeline { left: 12px; right: 12px; bottom: 12px; height: 102px; padding: 0; display: grid; grid-template-columns: auto 1fr; background: var(--gr); border-color: var(--gr-3); color: var(--on-dark); }
  #timeline::after { content: ""; position: absolute; left: 0; bottom: 0; width: 240px; height: 3px; background: var(--cmyk-strip); }
  #timeline .lbl { color: var(--on-dark-3); }
  .ctl { display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 10px 14px; border-right: 1px solid var(--dline); }
  .keys { display: flex; gap: 4px; }
  .key { min-width: 44px; height: 34px; padding: 0 8px; background: var(--gr-2); border: 1px solid var(--dline-2); border-bottom-width: 2px; border-radius: 2px; cursor: pointer; display: grid; place-items: center; line-height: 1; color: var(--on-dark); }
  .key b { font-size: 12px; } .key small { display: block; margin-top: 3px; font: 500 8.5px var(--mono); letter-spacing: .12em; color: var(--on-dark-3); }
  .key:hover { border-color: var(--blue-lite); }
  .key.play { min-width: 74px; background: var(--blue); border-color: var(--blue); color: #fff; } .key.play small { color: rgba(255,255,255,.75); }
  .key.play.on { background: var(--gr-2); border-color: var(--blue-lite); color: var(--blue-lite); }
  .speed { display: flex; align-items: center; gap: 6px; }
  .seg { display: flex; border: 1px solid var(--dline-2); border-radius: 2px; overflow: hidden; }
  .seg button { background: var(--gr-2); border: 0; border-right: 1px solid var(--dline); padding: 4px 9px; font: 600 10.5px var(--mono); cursor: pointer; color: var(--on-dark-3); }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--blue); color: #fff; }
  .trk { display: grid; grid-template-rows: auto 1fr auto; gap: 6px; padding: 10px 16px 10px 14px; min-width: 0; }
  .readout { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
  .readout .big { font: 600 15px var(--mono); color: #fff; white-space: nowrap; }
  .readout .big em { font-style: normal; color: var(--on-dark-3); }
  .readout .cur { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; color: var(--on-dark-2); }
  .rail { position: relative; height: 26px; }
  .rail .bands { position: absolute; left: 0; right: 0; top: 7px; height: 12px; background: var(--gr-3); border: 1px solid var(--dline); }
  .rail .band { position: absolute; top: 0; bottom: 0; opacity: .55; }
  .rail .past { position: absolute; top: 7px; left: 0; height: 12px; background: rgba(40,124,194,.35); border-right: 2px solid #fff; pointer-events: none; }
  .rail .tick { position: absolute; top: 2px; width: 1px; height: 22px; background: var(--dline-2); }
  .rail .alert { position: absolute; top: -2px; width: 0; height: 0; transform: translateX(-6px); border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid var(--k-m); pointer-events: none; }
  .rail .alert::after { content: ""; position: absolute; left: -1px; top: 1px; width: 2px; height: 20px; background: var(--k-m); }
  .rail input { position: absolute; inset: 0; width: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .scale { position: relative; height: 12px; font: 500 10.5px var(--mono); letter-spacing: .08em; color: var(--on-dark-3); }
  .scale span { position: absolute; transform: translateX(-2px); white-space: nowrap; }

  .stg { display: inline-block; flex: none; font: 700 10.5px/1 var(--sans); padding: 3px 5px; margin-right: 7px; border-radius: 2px; letter-spacing: .02em; border: 1px solid; vertical-align: 1px; }
  .g-data { background: var(--cyan-soft); color: var(--cyan); border-color: rgba(0,143,145,.4); }
  .g-state { background: var(--blue-soft); color: var(--blue); border-color: rgba(40,124,194,.4); }
  .g-warn { background: var(--orange-soft); color: var(--orange); border-color: rgba(193,108,69,.5); }
  .g-neutral { background: rgba(48,56,61,.06); color: var(--ink-2); border-color: var(--line); }
  #timeline .g-data { background: rgba(0,143,145,.28); color: #7fdad9; border-color: rgba(127,218,217,.4); }
  #timeline .g-state { background: rgba(40,124,194,.3); color: #a9cdf0; border-color: rgba(169,205,240,.4); }
  #timeline .g-warn { background: rgba(193,108,69,.3); color: #f0b597; border-color: rgba(240,181,151,.45); }
  #timeline .g-neutral { background: rgba(231,233,231,.1); color: var(--on-dark-2); border-color: var(--dline-2); }
  .r2 { display: inline-block; font: 700 9.5px/1 var(--mono); color: var(--orange); border: 1px solid var(--orange); padding: 3px 4px; margin-right: 4px; border-radius: 2px; vertical-align: 1px; }
  #timeline .r2 { color: #f0b597; border-color: #f0b597; }
  .readout .cur b { color: #fff; font-weight: 700; }
  .bignum { display: flex; align-items: baseline; gap: 4px; margin: 2px 0 2px; } .bignum b { font: 700 20px/1.1 var(--mono); color: var(--ink); } .bignum span { font-size: 12px; color: var(--ink-2); }
  .utag { display: inline-block; font: 700 10.5px/1 var(--mono); padding: 4px 5px; background: var(--gr); color: var(--on-dark); border-radius: 2px; }
  .utag.on { background: var(--blue); } .utag.warn { background: var(--orange); }
  .unit .nm .sub { display: block; height: auto; margin-top: 3px; background: none; opacity: 1; font-size: 11px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; }
  .chip.data { border-color: rgba(0,143,145,.45); color: var(--cyan); }
  .chips.col { flex-direction: column; align-items: stretch; } .chips.col .chip { text-align: left; display: flex; align-items: center; }
  .bay { cursor: pointer; } .bay:hover { border-color: var(--blue); }
  .bay.flash { animation: flash 1s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 3px rgba(40,124,194,.55); } 100% { box-shadow: 0 0 0 0 rgba(40,124,194,0); } }
  .bay.short.flash { animation-name: flashw; } @keyframes flashw { 0% { box-shadow: 0 0 0 3px rgba(193,108,69,.6); } 100% { box-shadow: 0 0 0 0 rgba(193,108,69,0); } }
  #tip { position: fixed; z-index: 10; pointer-events: none; background: var(--ti); color: var(--ink); border: 1px solid var(--line-2); border-left: 3px solid var(--blue); padding: 7px 10px; font-size: 12px; max-width: 320px; display: none; white-space: pre-line; box-shadow: 0 8px 20px rgba(0,0,0,.25); }
  @media (max-width: 1100px) { #left { width: 240px; } #right { width: 290px; } .sysbar .hatch, .stat.ver { display: none; } .notice { display: none !important; } }
</style>
</head>
<body>
<div id="stage"></div>

<header>
  <div class="sysbar">
    <div class="mark" aria-hidden="true"></div>
    <div class="brand"><b>RESEARCH<i>//</i>FACTORY</b><span>DEEP RESEARCH OPERATIONS SYSTEM</span></div>
    <div class="hatch"></div>
    <div class="stat"><span class="lbl">System</span><span class="led" id="sysLed">STANDBY</span></div>
    <div class="stat" id="modeBox"><span class="lbl">Mode</span><span class="v" id="modeText">대기 · 실행 없음</span></div>
    <div class="stat ver"><span class="lbl">Model</span><span class="v" id="modelText">—</span></div>
    <div class="tog">
      <button id="tLeft" title="왼쪽 패널 접기">L</button>
      <button id="tRight" title="오른쪽 패널 접기">R</button>
      <button id="quality" class="wide" title="그래픽 품질 전환">GFX HI</button>
    </div>
  </div>
  <div class="querybar">
    <span class="lbl">[01 / Research Query]</span>
    <input id="q" list="qlist" placeholder="연구 질문을 입력하세요" autocomplete="off">
    <datalist id="qlist"></datalist>
    <div id="notice" class="notice"><span class="lbl">Check</span><span id="noticeText" style="overflow:hidden;text-overflow:ellipsis"></span></div>
    <button id="run" class="btn primary">실제 호출로 연구 시작</button>
    <div class="vsep"></div>
    <span class="lbl">Replay</span>
    <select id="runs" title="저장된 실행 기록"></select>
    <button id="load" class="btn">기록 재생</button>
  </div>
</header>

<aside id="left" class="panel">
  <div class="ptitle"><h2>[ OPERATIONS ]<small>02 · 연구 운영 현황</small></h2><div class="fill"></div></div>
  <div class="pbody" id="leftBody"></div>
</aside>

<aside id="right" class="panel">
  <div class="tabs">
    <button data-tab="events" class="on"><b>03 / EVENTS</b><span>이벤트 <i class="num" id="cntEv"></i></span></button>
    <button data-tab="units"><b>04 / UNITS</b><span>설비 상세</span></button>
    <button data-tab="docs"><b>05 / DOCS</b><span>문서 <i class="num" id="cntDoc"></i></span></button>
    <button data-tab="report"><b>06 / REPORT</b><span>보고서</span></button>
  </div>
  <div class="view on" id="v-events"><div class="list" id="log"></div><div class="detail" id="detail"></div></div>
  <div class="view" id="v-units"><div class="list" id="unitList" style="flex:0 0 auto;max-height:44%"></div><div class="detail" id="unitDetail"></div></div>
  <div class="view" id="v-docs">
    <div class="filters" id="docFilters"><button data-f="all" class="on">ALL</button><button data-f="read">READ</button><button data-f="unread">UNREAD</button><button data-f="dup">SHARED</button></div>
    <div class="list" id="docList"></div><div class="detail" id="docDetail"></div>
  </div>
  <div class="view" id="v-report"><div class="report" id="report"></div></div>
</aside>

<footer id="timeline" class="panel">
  <div class="ctl">
    <div class="keys">
      <button class="key" id="first" title="처음 (Home)"><span><b>⏮</b><small>HOME</small></span></button>
      <button class="key" id="prevNode" title="이전 노드 (Shift+←)"><span><b>◀◀</b><small>NODE</small></span></button>
      <button class="key" id="prev" title="한 이벤트 뒤로 (←)"><span><b>◀</b><small>STEP</small></span></button>
      <button class="key play" id="play" title="재생 / 멈춤 (Space)"><span><b>▶</b><small>RUN</small></span></button>
      <button class="key" id="next" title="한 이벤트 앞으로 (→)"><span><b>▶</b><small>STEP</small></span></button>
      <button class="key" id="nextNode" title="다음 노드로 건너뛰기 (Shift+→)"><span><b>▶▶</b><small>NODE</small></span></button>
      <button class="key" id="last" title="끝 (End)"><span><b>⏭</b><small>END</small></span></button>
    </div>
    <div class="speed"><span class="lbl">[07 / Playback]</span><span class="lbl" style="margin-left:auto">Rate</span>
      <div class="seg" id="speed"><button data-s="0.5">0.5×</button><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button></div>
    </div>
  </div>
  <div class="trk">
    <div class="readout"><span class="big" id="evNo">EV ——— <em>/ ———</em></span><span class="big" id="evT"><em>T+</em>—</span><span class="cur" id="evDesc">기록을 불러오거나 실행을 시작하세요</span></div>
    <div class="rail"><div class="bands" id="bands"></div><div class="past" id="past"></div><div id="ticks"></div><input type="range" id="slider" min="0" max="0" value="0" aria-label="타임라인"></div>
    <div class="scale" id="scale"></div>
  </div>
</footer>
<div id="tip"></div>

<script type="importmap">{ "imports": { "three": "/web/vendor/three.module.js" } }</script>
<script type="module" src="/web/app.js"></script>
</body>
</html>
